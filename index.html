<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasqyra totale – Hyrjet, Daljet, Stoku, Borxhet, Pagesat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#6b7385; --line:#e3e6ec;
  --brand:#1f4fd1; --brand-soft:#e8eefc; --green:#127a46; --green-soft:#e3f4ea;
  --red:#b42318; --red-soft:#fdeceb; --amber:#a15c00; --amber-soft:#fff3dc;
  --cash:#127a46; --bank:#1f4fd1; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .biz{color:var(--muted);font-weight:500}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.warn{color:var(--amber)} .status.err{color:var(--red)}
nav{display:flex;gap:2px;padding:0 14px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;border-top:1px solid var(--line);background:#fafbfc}
.filter label{font-size:12px;color:var(--muted)}
main{padding:20px;max-width:1300px;margin:0 auto}
h2{font-size:16px;margin:24px 0 10px}
h2:first-child{margin-top:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.cash{border-left:4px solid var(--cash)} .kpi.bank{border-left:4px solid var(--bank)}
.kpi.red{border-left:4px solid var(--red)} .kpi.amber{border-left:4px solid var(--amber)}
.kpi.ink{border-left:4px solid var(--ink)}
.kpi.debtk{cursor:pointer;transition:transform .12s,box-shadow .12s}.kpi.debtk:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.kpi.hot{background:#fff1f1;border:1px solid #f3c2c2;border-left:6px solid var(--red)}.kpi.hot .v{color:var(--red);font-size:28px;font-weight:800}.kpi.hot .l{color:var(--red);font-weight:700}
.kpi .cta{margin-top:8px;font-size:12px;font-weight:700;color:var(--red)}
.kpi.hot{animation:dpulse 2.4s ease-in-out 3}@keyframes dpulse{0%,100%{box-shadow:0 0 0 0 rgba(200,30,30,0)}50%{box-shadow:0 0 0 6px rgba(200,30,30,.15)}}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:#fafbfc}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:500}
.tag.cash{background:var(--green-soft);color:var(--cash)} .tag.bank{background:var(--brand-soft);color:var(--bank)}
.tag.debt{background:var(--red-soft);color:var(--red)} .tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)} .tag.grey{background:#eef0f3;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500}
button:hover{border-color:#c7ccd6}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
button.pri:hover{background:#1a43b3}
button.dang{color:var(--red)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:6px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:820px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.small{max-width:480px} .modal.wide{max-width:900px}
.cbox{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.cbox b{font-size:14px}
.inv{background:#fff;border:1px solid var(--line);padding:28px;font-size:12px;color:#111}
.inv table td,.inv table th{white-space:normal}
.inv h3{margin:0;font-size:18px}
.invtot td:last-child{text-align:right}
.kv{display:grid;grid-template-columns:110px 1fr;gap:2px 8px}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%}
.f input[type=checkbox]{width:auto;flex:none}
.lines td{padding:5px 6px}
.lines input,.lines select{width:100%}
.paybox{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.paybox .big{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef0f3;margin-top:8px}
.split i{display:block;height:100%}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Pasqyra totale <span class="biz" id="bizName"></span></h1>
    <span class="status" id="status">Duke u lidhur…</span>
  </div>
  <nav id="nav"></nav>
  <div class="filter">
    <label>Periudha nga</label><input type="date" id="fNga">
    <label>deri</label><input type="date" id="fDeri">
    <button class="sm" data-p="sot">Sot</button>
    <button class="sm" data-p="muaj">Ky muaj</button>
    <button class="sm" data-p="mp">Muaji i kaluar</button>
    <button class="sm" data-p="vit">Ky vit</button>
    <button class="sm" data-p="all">Të gjitha</button>
  </div>
</header>
<main id="main"></main>
<div id="modalRoot"></div>

<script>
// ---------- state ----------
const COLS = ["produktet","hyrjet","daljet","pagesat","porosite","korrigjimet","klientet","agjentet","automjetet","pikat","levizjet","servisimet","serviseret","aparatet","modelet","arka","revizionet","leximet"];
const S = {produktet:[],hyrjet:[],daljet:[],pagesat:[],porosite:[],korrigjimet:[],klientet:[],agjentet:[],automjetet:[],pikat:[],levizjet:[],servisimet:[],serviseret:[],aparatet:[],modelet:[],arka:[],revizionet:[],leximet:[],settings:{},tab:"pasqyra",nga:"",deri:"",canWrite:true};
let db = null, localMode = false;

const TABS = [
  ["pasqyra","Pasqyra"],["raporti","📅 Raporti ditor"],["faturimi","Faturimi"],["klientet","Klientët"],["agjentet","Agjentët"],["pikat","📍 Pikat"],["leximet","🧾 Leximet mujore"],["servisimi","Servisimi"],["revizion","🔧 Servis komplet"],["hyrjet","Hyrjet (blerjet)"],["daljet","Daljet (shitjet)"],
  ["stoku","Stoku"],["borxhet","Borxhet"],["pagesat","Pagesat & Arka"],
  ["porosite","Porositë"],["produktet","Produktet"],["cilesimet","Cilësimet"]
];
const PLLOJ = {
  arketim:{t:"Arkëtim nga klienti",dir:1},
  pagese_furnitori:{t:"Pagesë te furnitori",dir:-1},
  shpenzim:{t:"Shpenzim",dir:-1},
  hyrje_tjeter:{t:"Të hyra tjera",dir:1},
  transfer_cb:{t:"Transfer: Cash → Bankë",dir:0},
  transfer_bc:{t:"Transfer: Bankë → Cash",dir:0}
};
const PSTAT = {e_re:["E re – pa konfirmuar","debt"],ne_proces:["Konfirmuar – në përgatitje","warn"],derguar:["Dërguar","bank"],pranuar:["Pranuar nga klienti","bank"],e_kryer:["E përfunduar","ok"],anuluar:["Anuluar","debt"]};

// ---------- helpers ----------
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const r2 = n=>Math.round((n+Number.EPSILON)*100)/100;
const cur = ()=>S.settings.monedha||"€";
function fmt(n){n=r2(n||0);const s=Math.abs(n).toFixed(2).split(".");s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");return (n<0?"−":"")+s[0]+","+s[1]+" "+cur()}
function fq(n){n=r2(n||0);return String(n).replace(".",",")}
const nowLocal = ()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const today = ()=>nowLocal().slice(0,10);
const fd = d=>d?d.split("-").reverse().join("."):"";
const key = s=>String(s||"").trim().toLowerCase();
const inP = d=>(!S.nga||d>=S.nga)&&(!S.deri||d<=S.deri);
const upTo = d=>(!S.deri||d<=S.deri);
const prod = id=>S.produktet.find(p=>p.id===id);
const linesSum = f=>(f.artikujt||[]).reduce((a,l)=>a+num(l.sasia)*num(l.cmimi),0);
function vat(f){const s=linesSum(f),rt=num(f.tvsh);if(f.tvshPerfshihet===false){const tax=s*rt/100;return {sub:r2(s),tax:r2(tax),tot:r2(s+tax),rt}}const sub=rt?s/(1+rt/100):s;return {sub:r2(sub),tax:r2(s-sub),tot:r2(s),rt}}
const invTotal = f=>vat(f).tot;
const sales = ()=>S.daljet.filter(d=>d.lloji!=="profature");
const kl = id=>S.klientet.find(k=>k.id===id);
const ag = id=>S.agjentet.find(a=>a.id===id);
const LV=["A","B","C"];
const lvName = l=>((S.settings.cmimiEmrat||{})[l])||("Çmimi "+l);
const priceOf=(p,l)=>{if(!p)return 0;const a=num(p.cmimiShitje);if(l==="B")return p.cmimiB===""||p.cmimiB===undefined?a:num(p.cmimiB);if(l==="C")return p.cmimiC===""||p.cmimiC===undefined?a:num(p.cmimiC);return a};
const klLbl = k=>k?(k.kompania||"")+(k.emriTregtar?" ("+k.emriTregtar+")":"")+(k.qyteti?" – "+k.qyteti:""):"";
const clLevel = k=>(k&&LV.includes(k.nivelCmimi))?k.nivelCmimi:"A";
const agName = f=>(f.agjentId&&ag(f.agjentId)&&ag(f.agjentId).emri)||f.agjenti||"";
const clientOf = f=>(f.klientId&&kl(f.klientId))||S.klientet.find(k=>key(k.kompania)===key(f.pala))||null;
const invDebt = f=>r2(invTotal(f)-num(f.cash)-num(f.bank));
const byDate = (a,b)=>(b.data||"").localeCompare(a.data||"")||(b.krijuar||0)-(a.krijuar||0);
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

// ---------- storage ----------
async function save(col,id,data){
  data = JSON.parse(JSON.stringify(data));
  if(localMode){
    const arr=S[col]; if(!id){id="l"+Date.now()+Math.random().toString(36).slice(2,6);data.krijuar=Date.now();arr.push({id,...data})}
    else{const i=arr.findIndex(x=>x.id===id);if(i<0)arr.push({id,...data});else arr[i]={id,...data}}
    render();return id;
  }
  try{
    if(!id){data.krijuar=Date.now();const ref=db.collection(col).doc();id=ref.id;await ref.set(data)}
    else await db.collection(col).doc(id).set(data);
    toast("U ruajt");return id;
  }catch(e){handleErr(e);return null}
}
async function del(col,id){
  if(localMode){S[col]=S[col].filter(x=>x.id!==id);render();return}
  try{await db.collection(col).doc(id).delete();toast("U fshi")}catch(e){handleErr(e)}
}
async function saveSettings(data){
  if(localMode){S.settings=data;render();return}
  try{await db.doc("config/settings").set(data);await db.doc("config/public").set({emriBiznesit:data.emriBiznesit||"",cmimiEmrat:data.cmimiEmrat||{}});toast("Cilësimet u ruajtën")}catch(e){handleErr(e)}
}
function handleErr(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") toast("Hapësira e ruajtjes është plot – fshini disa regjistrime të vjetra.");
  else if(c==="invalid_argument"){S.canWrite=false;toast("Nuk keni të drejtë të ndryshoni të dhënat.");render()}
  else toast("Gabim gjatë ruajtjes. Provoni përsëri.");
}

// ---------- calculations ----------
function avgCost(pid){
  let q=0,v=0;
  S.hyrjet.forEach(h=>{if(!upTo(h.data))return;(h.artikujt||[]).forEach(l=>{if(l.produktId===pid){q+=num(l.sasia);v+=num(l.sasia)*num(l.cmimi)}})});
  const p=prod(pid);
  if(q>0)return v/q;
  return num(p&&p.cmimiBlerje);
}
function stockRows(){
  const LS=locStocks();
  return S.produktet.map(p=>{
    let hy=0,da=0,ko=0;
    S.hyrjet.forEach(h=>{if(upTo(h.data))(h.artikujt||[]).forEach(l=>{if(l.produktId===p.id)hy+=num(l.sasia)})});
    sales().forEach(d=>{if(upTo(d.data))(d.artikujt||[]).forEach(l=>{if(l.produktId===p.id)da+=num(l.sasia)})});
    S.korrigjimet.forEach(k=>{if(k.produktId===p.id&&upTo(k.data))ko+=num(k.diferenca)});
    const fill=num(p.stokFillestar), real=r2(fill+hy-da+ko), ac=avgCost(p.id);
    let auto=0,pike=0;Object.entries(LS).forEach(([l,m])=>{const q=num(m[p.id]);if(l.startsWith("a:"))auto+=q;else if(l.startsWith("p:"))pike+=q});
    auto=r2(auto);pike=r2(pike);
    return {p,fill,hy,da,ko,real,ac,vlera:real*ac,auto,pike,depo:r2(real-auto-pike)};
  }).sort((a,b)=>(a.p.emri||"").localeCompare(b.p.emri||""));
}
function moneyMoves(){
  const m=[];
  sales().forEach(d=>{const c=num(d.cash),b=num(d.bank);if(c||b)m.push({data:d.data,lloji:"Shitje",pala:d.pala,nr:d.nr,ci:c,co:0,bi:b,bo:0,krijuar:d.krijuar})});
  S.hyrjet.forEach(h=>{const c=num(h.cash),b=num(h.bank);if(c||b)m.push({data:h.data,lloji:"Blerje",pala:h.pala,nr:h.nr,ci:0,co:c,bi:0,bo:b,krijuar:h.krijuar})});
  S.pagesat.forEach(p=>{
    const s=num(p.shuma),L=PLLOJ[p.lloji]||{t:p.lloji,dir:0};const o={data:p.data,lloji:L.t,pala:p.pala||p.kategoria||"",nr:p.shenim||"",ci:0,co:0,bi:0,bo:0,krijuar:p.krijuar};
    if(p.lloji==="transfer_cb"){o.co=s;o.bi=s}
    else if(p.lloji==="transfer_bc"){o.bo=s;o.ci=s}
    else if(L.dir>0){p.metoda==="bank"?o.bi=s:o.ci=s}
    else {p.metoda==="bank"?o.bo=s:o.co=s}
    m.push(o);
  });
  return m.sort(byDate);
}
function balances(){
  let cash=num(S.settings.cashFillestar),bank=num(S.settings.bankFillestar);
  moneyMoves().forEach(x=>{if(upTo(x.data)){cash+=x.ci-x.co;bank+=x.bi-x.bo}});
  return {cash:r2(cash),bank:r2(bank)};
}
function debts(){
  const cl={},su={};
  const add=(map,name,field,v)=>{const k=key(name)||"(pa emër)";map[k]=map[k]||{emri:(name||"(pa emër)").trim(),fat:0,pag:0,nrFat:0,last:""};map[k][field]+=v;return map[k]};
  sales().forEach(d=>{if(!upTo(d.data))return;const x=invDebt(d);if(x>0.004){const r=add(cl,d.pala,"fat",x);r.nrFat++;if(d.data>r.last)r.last=d.data}});
  S.hyrjet.forEach(h=>{if(!upTo(h.data))return;const x=invDebt(h);if(x>0.004){const r=add(su,h.pala,"fat",x);r.nrFat++;if(h.data>r.last)r.last=h.data}});
  S.pagesat.forEach(p=>{if(!upTo(p.data))return;
    if(p.lloji==="arketim")add(cl,p.pala,"pag",num(p.shuma));
    if(p.lloji==="pagese_furnitori")add(su,p.pala,"pag",num(p.shuma));
  });
  const fin=m=>Object.values(m).map(r=>({...r,mbetja:r2(r.fat-r.pag)})).filter(r=>Math.abs(r.mbetja)>0.004).sort((a,b)=>b.mbetja-a.mbetja);
  return {klientet:fin(cl),furnitoret:fin(su)};
}
function partyNames(which){
  const s=new Set();
  if(which!=="su"){S.klientet.forEach(k=>k.kompania&&s.add(k.kompania.trim()));sales().forEach(d=>d.pala&&s.add(d.pala.trim()));S.porosite.forEach(p=>p.klienti&&s.add(p.klienti.trim()))}
  if(which!=="cl"){S.hyrjet.forEach(h=>h.pala&&s.add(h.pala.trim()));if(which==="su")S.klientet.forEach(k=>k.kompania&&s.add(k.kompania.trim()))}
  S.pagesat.forEach(p=>{if(p.pala&&(which==="all"||(which==="cl"&&p.lloji==="arketim")||(which==="su"&&p.lloji==="pagese_furnitori")))s.add(p.pala.trim())});
  return [...s].sort();
}

// ---------- render ----------
function render(){
  if(!localMode&&db&&!document.body.classList.contains("agent")){importDepo();publishStock();publishReports()}
  $("#bizName").textContent=S.settings.emriBiznesit?"· "+S.settings.emriBiznesit:"";
  const pn=S.mbushjet?pending().length:0;
  $("#nav").innerHTML=TABS.map(([k,t])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}">${t}${k==="agjentet"&&pn?` <span class="tag warn">${pn}</span>`:""}${k==="porosite"&&porNew().length?`<span class="tabbadge">${porNew().length}</span>`:""}${k==="servisimi"&&openServ().length?` <span class="tag debt">${openServ().length}</span>`:""}</button>`).join("");
  const f={pasqyra:rPasqyra,raporti:rRaporti,faturimi:rFaturimi,klientet:rKlientet,agjentet:rAgjentet,pikat:rPikat,leximet:rLeximet,servisimi:rServisimi,revizion:rRevizion,hyrjet:()=>rInvoices("hyrjet"),daljet:()=>rInvoices("daljet"),stoku:rStoku,borxhet:rBorxhet,pagesat:rPagesat,porosite:rPorosite,produktet:rProduktet,cilesimet:rCilesimet}[S.tab];
  sCss();porCss();porTrackCss();porNotify();porAutoClose();$("#main").innerHTML=(S.tab!=="pasqyra"?porAlertHTML(false):"")+(S.tab!=="servisimi"?bannerHTML(true):"")+f();
}
const W=()=>S.canWrite?"":"disabled";
const periodLbl=()=>S.nga||S.deri?`${S.nga?fd(S.nga):"fillimi"} – ${S.deri?fd(S.deri):"sot"}`:"të gjitha datat";

function rPasqyra(){
  const b=balances(), st=stockRows(), D=debts();
  const vStok=st.reduce((a,r)=>a+r.vlera,0);
  const dCl=D.klientet.reduce((a,r)=>a+r.mbetja,0), dSu=D.furnitoret.reduce((a,r)=>a+r.mbetja,0);
  const agg=(arr)=>{const o={t:0,c:0,b:0,d:0,n:0};arr.forEach(f=>{if(!inP(f.data))return;o.t+=invTotal(f);o.c+=num(f.cash);o.b+=num(f.bank);o.d+=invDebt(f);o.n++});return o};
  const sh=agg(sales()), bl=agg(S.hyrjet);
  const pg=l=>{const o={t:0,c:0,b:0,n:0};S.pagesat.forEach(p=>{if(p.lloji!==l||!inP(p.data))return;const s=num(p.shuma);o.t+=s;p.metoda==="bank"?o.b+=s:o.c+=s;o.n++});return o};
  const ar=pg("arketim"),pf=pg("pagese_furnitori"),sp=pg("shpenzim"),ht=pg("hyrje_tjeter");
  let cogs=0;sales().forEach(d=>{if(inP(d.data))(d.artikujt||[]).forEach(l=>{if(l.produktId)cogs+=num(l.sasia)*avgCost(l.produktId)})});
  const bruto=sh.t-cogs, neto=bruto-sp.t+ht.t;
  const mv=moneyMoves().filter(x=>inP(x.data));
  const fl={ci:0,co:0,bi:0,bo:0};mv.forEach(x=>{fl.ci+=x.ci;fl.co+=x.co;fl.bi+=x.bi;fl.bo+=x.bo});
  const low=st.filter(r=>r.p.stokMin!==undefined&&r.p.stokMin!==""&&r.real<=num(r.p.stokMin));
  const open=S.porosite.filter(p=>["e_re","ne_proces","derguar","pranuar"].includes(p.statusi));
  const tot=b.cash+b.bank, pc=tot>0?Math.max(0,b.cash)/(Math.max(0,b.cash)+Math.max(0,b.bank)||1)*100:50;
  const row=(n,o,deb=true)=>`<tr><td>${n} <span class="mut">(${o.n})</span></td><td class="n">${fmt(o.t)}</td><td class="n">${fmt(o.c)}</td><td class="n">${fmt(o.b)}</td><td class="n">${deb?fmt(o.d):"<span class='mut'>–</span>"}</td></tr>`;
  return `<div class="bar" style="margin-bottom:12px"><button class="pri" data-act="newPorFull" ${W()} style="font-size:15px;padding:10px 18px">🛒 Krijo porosi</button><b style="margin-left:6px">Monitorimi i porosive</b><span class="sp"></span><button data-tab="porosite">Të gjitha porositë »</button></div>${porPipeline(true)}${porAlertHTML(true)}
  <h2>Gjendja e parasë dhe e pasurisë ${S.deri?"më "+fd(S.deri):"sot"}</h2>
  <div class="grid">
    <div class="card kpi cash"><div class="l">Cash në arkë</div><div class="v ${b.cash<0?"neg":""}">${fmt(b.cash)}</div><div class="s">Para të gatshme</div></div>
    <div class="card kpi bank"><div class="l">Në bankë</div><div class="v ${b.bank<0?"neg":""}">${fmt(b.bank)}</div><div class="s">Llogaria bankare</div></div>
    <div class="card kpi ink"><div class="l">Totali i parasë</div><div class="v">${fmt(tot)}</div>
      <div class="split"><i style="width:${pc}%;background:var(--cash)"></i><i style="width:${100-pc}%;background:var(--bank)"></i></div>
      <div class="s"><span class="pos">■</span> Cash ${Math.round(pc)}% · <span style="color:var(--bank)">■</span> Bankë ${Math.round(100-pc)}%</div></div>
    <div class="card kpi amber"><div class="l">Vlera e stokut</div><div class="v">${fmt(vStok)}</div><div class="s">${st.length} produkte · me kosto mesatare</div></div>
    <div class="card kpi debtk ${dCl>0?"hot":"ink"}" data-act="debtList" data-kind="cl" role="button" tabindex="0"><div class="l">⚠️ Na detyrohen (klientët)</div><div class="v">${fmt(dCl)}</div><div class="s">${D.klientet.filter(r=>r.mbetja>0).length} klientë me borxh</div><div class="cta">👆 Prek për të parë kush ka borxh →</div></div>
    <div class="card kpi debtk ${dSu>0?"red":"ink"}" data-act="debtList" data-kind="su" role="button" tabindex="0"><div class="l">U detyrohemi (furnitorëve)</div><div class="v">${fmt(dSu)}</div><div class="s">${D.furnitoret.length} furnitorë</div><div class="cta" style="color:var(--muted)">Prek për detajet →</div></div>
    <div class="card kpi ink"><div class="l">Gjendja neto</div><div class="v">${fmt(tot+vStok+dCl-dSu)}</div><div class="s">Para + stok + na detyrohen − u detyrohemi</div></div>
  </div>

  <h2>Lëvizjet në periudhë: ${periodLbl()}</h2>
  <div class="tablewrap"><table>
    <tr><th>Kategoria</th><th class="n">Totali</th><th class="n">Cash</th><th class="n">Bankë</th><th class="n">Borxh (pa paguar)</th></tr>
    ${row("Daljet / Shitjet",sh)}
    ${row("Hyrjet / Blerjet",bl)}
    ${row("Arkëtime nga klientët (borxhe)",ar,false)}
    ${row("Pagesa te furnitorët (borxhe)",pf,false)}
    ${row("Shpenzime",sp,false)}
    ${row("Të hyra tjera",ht,false)}
  </table></div>

  <div class="two" style="margin-top:16px">
    <div>
      <h2 style="margin-top:0">Rezultati (fitimi)</h2>
      <div class="tablewrap"><table>
        <tr><td>Shitjet</td><td class="n">${fmt(sh.t)}</td></tr>
        <tr><td>− Kosto e mallit të shitur</td><td class="n">${fmt(cogs)}</td></tr>
        <tr class="tot"><td>Fitimi bruto</td><td class="n ${bruto<0?"neg":"pos"}">${fmt(bruto)}</td></tr>
        <tr><td>− Shpenzime</td><td class="n">${fmt(sp.t)}</td></tr>
        <tr><td>+ Të hyra tjera</td><td class="n">${fmt(ht.t)}</td></tr>
        <tr class="tot"><td>Fitimi neto</td><td class="n ${neto<0?"neg":"pos"}">${fmt(neto)}</td></tr>
      </table></div>
    </div>
    <div>
      <h2 style="margin-top:0">Fluksi i parasë në periudhë</h2>
      <div class="tablewrap"><table>
        <tr><th></th><th class="n">Hyri</th><th class="n">Doli</th><th class="n">Neto</th></tr>
        <tr><td><span class="tag cash">Cash</span></td><td class="n pos">${fmt(fl.ci)}</td><td class="n neg">${fmt(fl.co)}</td><td class="n">${fmt(fl.ci-fl.co)}</td></tr>
        <tr><td><span class="tag bank">Bankë</span></td><td class="n pos">${fmt(fl.bi)}</td><td class="n neg">${fmt(fl.bo)}</td><td class="n">${fmt(fl.bi-fl.bo)}</td></tr>
        <tr class="tot"><td>Gjithsej</td><td class="n">${fmt(fl.ci+fl.bi)}</td><td class="n">${fmt(fl.co+fl.bo)}</td><td class="n">${fmt(fl.ci+fl.bi-fl.co-fl.bo)}</td></tr>
      </table></div>
    </div>
  </div>

  <div class="two" style="margin-top:16px">
    <div><h2 style="margin-top:0">Stoku nën minimum</h2>
      <div class="tablewrap">${low.length?`<table><tr><th>Produkti</th><th class="n">Stoku</th><th class="n">Minimumi</th></tr>${low.map(r=>`<tr><td>${esc(r.p.emri)}</td><td class="n neg">${fq(r.real)} ${esc(r.p.njesia||"")}</td><td class="n">${fq(num(r.p.stokMin))}</td></tr>`).join("")}</table>`:`<div class="empty">Asnjë produkt nën minimum.</div>`}</div></div>
    <div><h2 style="margin-top:0">Porositë e hapura</h2>
      <div class="tablewrap">${open.length?`<table><tr><th>Afati</th><th>Klienti</th><th class="n">Shuma</th><th>Statusi</th></tr>${open.sort((a,b)=>(a.afati||"9").localeCompare(b.afati||"9")).map(p=>`<tr><td>${fd(p.afati)||"–"}</td><td>${esc(p.klienti)}</td><td class="n">${fmt(num(p.shuma))}</td><td><span class="tag ${PSTAT[p.statusi][1]}">${PSTAT[p.statusi][0]}</span></td></tr>`).join("")}</table>`:`<div class="empty">Asnjë porosi e hapur.</div>`}</div></div>
  </div>

  <h2>Libri i arkës dhe i bankës (${periodLbl()})</h2>
  <div class="tablewrap">${mv.length?`<table>
    <tr><th>Data</th><th>Lloji</th><th>Pala / Përshkrimi</th><th>Nr./Shënim</th><th class="n">Cash hyrje</th><th class="n">Cash dalje</th><th class="n">Bankë hyrje</th><th class="n">Bankë dalje</th></tr>
    ${mv.map(x=>`<tr><td>${fd(x.data)}</td><td>${esc(x.lloji)}</td><td>${esc(x.pala)}</td><td class="mut">${esc(x.nr)}</td>
      <td class="n pos">${x.ci?fmt(x.ci):""}</td><td class="n neg">${x.co?fmt(x.co):""}</td><td class="n pos">${x.bi?fmt(x.bi):""}</td><td class="n neg">${x.bo?fmt(x.bo):""}</td></tr>`).join("")}
    <tr class="tot"><td colspan="4">Gjithsej</td><td class="n">${fmt(fl.ci)}</td><td class="n">${fmt(fl.co)}</td><td class="n">${fmt(fl.bi)}</td><td class="n">${fmt(fl.bo)}</td></tr>
  </table>`:`<div class="empty">Nuk ka lëvizje parash në këtë periudhë.</div>`}</div>`;
}

function rInvoices(col){
  const out=col==="daljet";
  const q=key(S["q_"+col]);
  const list=(col==="daljet"?sales():S[col]).filter(f=>inP(f.data)&&(!q||key(f.pala).includes(q)||key(f.nr).includes(q))).sort(byDate);
  const T={t:0,c:0,b:0,d:0};list.forEach(f=>{T.t+=invTotal(f);T.c+=num(f.cash);T.b+=num(f.bank);T.d+=invDebt(f)});
  const summ=f=>{const a=f.artikujt||[];const n=a.map(l=>l.produktId?(prod(l.produktId)||{}).emri||"?":l.pershkrim||"Tjetër");return esc(n.slice(0,2).join(", ")+(n.length>2?` +${n.length-2}`:""))};
  return `<div class="bar">
    <button class="pri" data-act="newInv" data-col="${col}" ${W()}>+ ${out?"Dalje e re (shitje)":"Hyrje e re (blerje)"}</button>
    <input placeholder="Kërko ${out?"klientin":"furnitorin"} ose nr…" data-q="${col}" value="${esc(S["q_"+col]||"")}" style="width:240px">
    <span class="sp"></span><span class="mut">${list.length} dokumente · ${periodLbl()}</span></div>
  <div class="tablewrap">${list.length?`<table>
    <tr><th>Data</th><th>Nr.</th><th>${out?"Pala – Klienti":"Pala – Furnitori"}</th><th>Artikujt</th><th class="n">Totali</th><th class="n">Cash</th><th class="n">Bankë</th><th class="n">Borxh</th><th></th></tr>
    ${list.map(f=>{const d=invDebt(f);return `<tr><td>${fd(f.data)}</td><td>${esc(f.nr)}</td><td>${esc(f.pala)}</td><td class="mut">${summ(f)}</td>
      <td class="n"><b>${fmt(invTotal(f))}</b></td><td class="n">${num(f.cash)?fmt(num(f.cash)):""}</td><td class="n">${num(f.bank)?fmt(num(f.bank)):""}</td>
      <td class="n">${d>0.004?`<span class="tag debt">${fmt(d)}</span>`:`<span class="tag ok">Paguar</span>`}</td>
      <td><button class="sm" data-act="editInv" data-col="${col}" data-id="${f.id}" ${W()}>Ndrysho</button> <button class="sm dang" data-act="delInv" data-col="${col}" data-id="${f.id}" ${W()}>Fshi</button></td></tr>`}).join("")}
    <tr class="tot"><td colspan="4">Gjithsej</td><td class="n">${fmt(T.t)}</td><td class="n">${fmt(T.c)}</td><td class="n">${fmt(T.b)}</td><td class="n">${fmt(T.d)}</td><td></td></tr>
  </table>`:`<div class="empty">Nuk ka ${out?"dalje":"hyrje"} në këtë periudhë. ${S.produktet.length?"":"Filloni duke shtuar produktet te skeda <b>Produktet</b>."}</div>`}</div>
  <p class="note">Borxhi = Totali − Cash − Bankë. Pagesat e mëvonshme të borxhit regjistrohen te <b>Pagesat & Arka</b> ose te <b>Borxhet</b>.</p>`;
}

function rStoku(){
  const st=stockRows();const q=key(S.q_stok);
  const list=st.filter(r=>!q||key(r.p.emri).includes(q)||key(r.p.kodi).includes(q));
  const tv=list.reduce((a,r)=>a+r.vlera,0);
  return `<div class="bar"><input placeholder="Kërko produktin…" data-q="stok" value="${esc(S.q_stok||"")}" style="width:240px"><span class="sp"></span>
    <span class="mut">Stoku real ${S.deri?"më "+fd(S.deri):"sot"}</span></div>
  <div class="tablewrap">${list.length?`<table>
  <tr><th>Produkti</th><th>Kodi</th><th class="n">Fillestar</th><th class="n">+ Hyrje</th><th class="n">− Dalje</th><th class="n">± Inventarizim</th><th class="n">Stoku real (total)</th><th class="n">Në depo</th><th class="n">Në automjete</th><th class="n">Në pika</th><th class="n">Kosto mes.</th><th class="n">Vlera</th><th></th></tr>
  ${list.map(r=>{const low=r.p.stokMin!==undefined&&r.p.stokMin!==""&&r.real<=num(r.p.stokMin);return `<tr><td><b>${esc(r.p.emri)}</b></td><td class="mut">${esc(r.p.kodi)}</td>
    <td class="n">${fq(r.fill)}</td><td class="n pos">${fq(r.hy)}</td><td class="n neg">${fq(r.da)}</td><td class="n">${r.ko?fq(r.ko):""}</td>
    <td class="n"><b class="${r.real<0||low?"neg":""}">${fq(r.real)}</b> ${esc(r.p.njesia||"")} ${low?'<span class="tag warn">Nën min.</span>':""}</td>
    <td class="n"><b class="${r.depo<0?"neg":""}">${fq(r.depo)}</b></td><td class="n">${r.auto?fq(r.auto):'<span class="mut">–</span>'}</td><td class="n">${r.pike?fq(r.pike):'<span class="mut">–</span>'}</td>
    <td class="n">${fmt(r.ac)}</td><td class="n">${fmt(r.vlera)}</td>
    <td><button class="sm" data-act="count" data-id="${r.p.id}" ${W()}>Numëro</button></td></tr>`}).join("")}
  <tr class="tot"><td colspan="11">Vlera totale e stokut</td><td class="n">${fmt(tv)}</td><td></td></tr></table>`:`<div class="empty">Nuk ka produkte. Shtoni te skeda <b>Produktet</b>.</div>`}</div>
  <p class="note">Stoku në automjete dhe pika: shihni skedat <b>Agjentët</b> (Automjetet) dhe <b>📍 Pikat</b> (butoni “Stoku”).</p>
  <p class="note"><b>Numëro</b> = inventarizim fizik: shkruani sasinë që gjendet realisht dhe diferenca regjistrohet si korrigjim.</p>
  ${S.korrigjimet.length?`<h2>Korrigjimet nga inventarizimi</h2><div class="tablewrap"><table><tr><th>Data</th><th>Produkti</th><th class="n">Diferenca</th><th>Shënim</th><th></th></tr>
  ${[...S.korrigjimet].sort(byDate).map(k=>`<tr><td>${fd(k.data)}</td><td>${esc((prod(k.produktId)||{}).emri||"?")}</td><td class="n ${num(k.diferenca)<0?"neg":"pos"}">${num(k.diferenca)>0?"+":""}${fq(num(k.diferenca))}</td><td class="mut">${esc(k.shenim)}</td><td><button class="sm dang" data-act="delKor" data-id="${k.id}" ${W()}>Fshi</button></td></tr>`).join("")}</table></div>`:""}`;
}

function rBorxhet(){
  const D=debts();
  const tbl=(rows,kind)=>rows.length?`<table><tr><th>${kind==="cl"?"Klienti":"Furnitori"}</th><th class="n">Borxh nga faturat</th><th class="n">Paguar më pas</th><th class="n">Mbetja</th><th></th></tr>
    ${rows.map(r=>`<tr><td><b>${esc(r.emri)}</b><div class="mut" style="font-size:12px">${r.nrFat} fatura${r.last?" · e fundit "+fd(r.last):""}</div></td><td class="n">${fmt(r.fat)}</td><td class="n">${fmt(r.pag)}</td>
      <td class="n"><b class="${r.mbetja>0?"neg":"pos"}">${fmt(r.mbetja)}</b></td>
      <td><button class="sm" data-act="payDebt" data-kind="${kind}" data-name="${esc(r.emri)}" data-amt="${r.mbetja}" ${W()}>${kind==="cl"?"Arkëto":"Paguaj"}</button></td></tr>`).join("")}
    <tr class="tot"><td>Gjithsej</td><td></td><td></td><td class="n">${fmt(rows.reduce((a,r)=>a+r.mbetja,0))}</td><td></td></tr></table>`:`<div class="empty">Asnjë borxh i hapur.</div>`;
  return `<div class="two">
    <div><h2 style="margin-top:0">Na detyrohen – Klientët</h2><div class="tablewrap">${tbl(D.klientet,"cl")}</div></div>
    <div><h2 style="margin-top:0">U detyrohemi – Furnitorët</h2><div class="tablewrap">${tbl(D.furnitoret,"su")}</div></div>
  </div><p class="note">Gjendja ${S.deri?"më "+fd(S.deri):"sot"}. Mbetja negative = pagesë më shumë se borxhi (avans).</p>`;
}

  ${list.map(p=>`<tr><td><b>${esc(p.emri)}</b></td><td class="mut">${esc(p.kodi)}</td><td>${esc(p.njesia)}</td><td class="n">${fmt(num(p.cmimiBlerje))}</td>${LV.map(l=>{const empty=l==="A"?!(num(p.cmimiShitje)>0):(p["cmimi"+l]===""||p["cmimi"+l]===undefined);return `<td class="n">${empty?'<span class="tag warn">mungon</span>':fmt(priceOf(p,l))}</td>`}).join("")}<td class="n">${fq(num(p.stokFillestar))}</td><td class="n">${p.stokMin===""||p.stokMin===undefined?"–":fq(num(p.stokMin))}</td>

function rCilesimet(){
  const s=S.settings;
  const I=(id,l,v,cls="")=>`<div class="f"><label>${l}</label><input class="${cls}" id="s_${id}" value="${esc(v??"")}"></div>`;

// ---------- modals ----------
function modal(title,body,{small=false,wide=false,onSave,saveText="Ruaj",extra=""}={}){
  const root=document.createElement("div");
  root.innerHTML=`<div class="ov"><div class="modal ${small?"small":""} ${wide?"wide":""}"><div class="mh">${title}<button class="sm" data-x>✕</button></div><div class="mb">${body}<div class="err" data-merr></div></div>
    <div class="mf">${extra}<span style="flex:1"></span><button data-x>${onSave?"Anulo":"Mbyll"}</button>${onSave?`<button class="pri" data-msave>${saveText}</button>`:""}</div></div></div>`;
  $("#modalRoot").appendChild(root);
  root.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
  root.querySelector(".ov").addEventListener("mousedown",e=>{if(e.target.classList.contains("ov"))close()});
  if(onSave)root.querySelector("[data-msave]").onclick=async()=>{const r=onSave();if(r===false)return;if(typeof r==="string"){root.querySelector("[data-merr]").textContent=r;return}close();await r};
  function close(){root.remove()}
  root.close=close;
  return root;
}
function confirmBox(msg,cb){modal("Konfirmo",`<p style="margin:0">${msg}</p>`,{small:true,saveText:"Po, fshije",onSave:()=>cb()})}

function nextNr(lloji,date){
  const d=(date||today()).split("-");const base=d[2]+d[1]+d[0].slice(2);
  const pre=lloji==="profature"?"":"F-";
  let n=0;S.daljet.forEach(x=>{const m=String(x.nr||"").match(/^(F-)?(\d{6})\/(\d+)$/);if(m&&m[2]===base&&((m[1]||"")===pre))n=Math.max(n,+m[3])});
  return `${pre}${base}/${n+1}`;
}
function clientCard(k){
  if(!k)return `<span class="mut">Zgjidhni klientin – të dhënat plotësohen automatikisht.</span>`;
  const row=(l,v)=>v?`<div class="mut">${l}</div><div>${esc(v)}</div>`:"";
  return `<b>${esc(k.kompania)}</b>${k.emriTregtar?` <span class="mut">(${esc(k.emriTregtar)})</span>`:""} <span class="tag grey">${esc(lvName(clLevel(k)))}</span><div class="kv" style="margin-top:6px">${row("Adresa",k.adresa)}${row("Qyteti",[k.kodiPostar,k.qyteti].filter(Boolean).join(" "))}${row("Shteti",k.shteti)}${row("Tel.",k.tel)}${row("E-mail",k.email)}${row("NUI / NID",k.nui)}${row("Nr. fiskal",k.nrFiskal)}${row("Nr. biznesit",k.nrBiznesit)}${row("Nr. TVSH",k.nrTvsh)}</div>
    ${[k.adresa,k.qyteti,k.tel,k.nui].some(Boolean)?"":`<div class="note">Ky klient ka vetëm emrin. Plotësoni adresën, NUI etj. te “Ndrysho klientin”.</div>`}`;
}
function invoiceModal(col,ex,opts={}){
  const out=col==="daljet";

    if(!ex){f.lloji=opts.lloji||"fature";f.tvsh=S.settings.tvsh??18;f.tvshPerfshihet=S.settings.tvshPerfshihet!==false;f.klientId=opts.klientId||"";f.agjentId=opts.agjentId||"";f.nr=nextNr(f.lloji,f.data)}
    if(!ex&&opts.fromPor){const P=opts.fromPor;f.pala=P.klienti;f.klientId=P.klientId||((clientOf({pala:P.klienti})||{}).id)||"";f.porosiId=P.id;f.agjentId=P.agjentId||"";f.artikujt=(P.artikujt||[]).map(l=>({produktId:l.produktId,pershkrim:"",njesia:(prod(l.produktId)||{}).njesia||"copë",sasia:num(l.sasia),cmimi:num(l.cmimi)}));f.shenim=P.mesazhi?"Porosia: "+P.mesazhi:""}

  }

  const names=partyNames(out?"cl":"su");

  const stockMap={};stockRows().forEach(r=>stockMap[r.p.id]=r.real);
  const isPro=()=>out&&f.lloji==="profature";
  const title=opts.fromMbushje?"Aprovo mbushjen → Faturë":ex&&!ex.id?"Faturë e re nga profatura "+esc(opts.convertFrom&&opts.convertFrom.nr||""):out?(ex?"Ndrysho "+(f.lloji==="profature"?"profaturën":"faturën"):(f.lloji==="profature"?"Profaturë e re":"Faturë e re (shitje)")):(ex?"Ndrysho hyrjen (blerjen)":"Hyrje e re – Blerje");
  const klNorm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ç/g,"c").replace(/ë/g,"e");
  const klMatch=(k,q)=>{if(!q)return true;const h=klNorm([k.kompania,k.emriTregtar,k.nrBiznesit,k.nrFiskal,k.shifra,k.qyteti,k.adresa,k.telefoni,k.kontakti].join(" "));return klNorm(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
  const clientOpts=(q)=>{const L=[...S.klientet].filter(k=>k.id===f.klientId||klMatch(k,q)).sort((a,b)=>(a.kompania||"").localeCompare(b.kompania||""));return `<option value="">${q?`— ${L.filter(k=>klMatch(k,q)).length} rezultate —`:"— Zgjidhni klientin —"}</option>`+L.map(k=>`<option value="${k.id}" ${f.klientId===k.id?"selected":""}>${esc(klLbl(k))}</option>`).join("")};
  const root=modal(title,`
    ${out?`<div class="fg">
      <div class="f"><label>Lloji i dokumentit</label><select id="iLl"><option value="fature" ${f.lloji!=="profature"?"selected":""}>Faturë (shitje – ul stokun)</option><option value="profature" ${f.lloji==="profature"?"selected":""}>Profaturë (ofertë – pa efekt në stok)</option></select></div>
      <div class="f" style="grid-column:span 2"><label>Pala – Klienti (${S.klientet.length} klientë në listë)</label><input id="iKlQ" type="search" placeholder="🔍 Kërko klientin: emri, NUI, shifra, qyteti, telefoni…" autocomplete="off" style="margin-bottom:6px"><div style="display:flex;gap:6px"><select id="iKl" style="flex:1">${clientOpts()}</select><button id="iNewKl" type="button">+ Klient i ri</button></div></div>
    </div><div class="cbox" id="iCard"></div>
    <div class="fg">
      <div class="f"><label>Agjenti (mbushja / dorëzimi)</label><select id="iAg"><option value="">— Pa agjent —</option>${[...S.agjentet].filter(a=>a.aktiv!==false||a.id===f.agjentId).sort((a,b)=>(a.emri||"").localeCompare(b.emri||"")).map(a=>`<option value="${a.id}" ${f.agjentId===a.id?"selected":""}>${esc(a.emri)}${a.zona?" – "+esc(a.zona):""}</option>`).join("")}</select></div>
      <div class="f"><label>Malli del nga</label><select id="iBur"><option value="depo">Depo</option>${S.automjetet.map(v=>`<option value="a:${v.id}" ${f.burimi==="a:"+v.id?"selected":""}>${esc(vehName(v))}</option>`).join("")}</select></div>
      <div class="f"><label>Pika / Vending machine</label><input id="iPika" list="dlPika" value="${esc(f.pika||"")}" placeholder="p.sh. Doktor – Gjilan, makina 1"><datalist id="dlPika">${[...new Set(S.daljet.map(d=>d.pika).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
    </div>`:""}
    <div class="fg">
      <div class="f"><label>Data</label><input type="date" id="iData" value="${f.data}"></div>
      <div class="f"><label>Nr. i ${out?"dokumentit":"faturës"}</label><input id="iNr" value="${esc(f.nr)}"></div>
      ${out?`<div class="f"><label>Lloji i çmimit</label><select id="iLv">${LV.map(l=>`<option value="${l}" ${(f.nivelCmimi||clLevel(kl(f.klientId)))===l?"selected":""}>${esc(lvName(l))}</option>`).join("")}</select></div>
      <div class="f"><label>TVSH %</label><input class="num" id="iTv" value="${fq(num(f.tvsh))}"></div>
      <div class="f"><label>Çmimet</label><select id="iTvP"><option value="1" ${f.tvshPerfshihet!==false?"selected":""}>përfshijnë TVSH</option><option value="0" ${f.tvshPerfshihet===false?"selected":""}>pa TVSH (shtohet)</option></select></div>`:
      `<div class="f" style="grid-column:span 2"><label>Furnitori</label><input id="iPala" list="dlPala" value="${esc(f.pala)}" placeholder="Emri"><datalist id="dlPala">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>`}
    </div>
    <div class="tablewrap"><table class="lines"><thead><tr><th style="width:38%">Produkti / Përshkrimi</th><th style="width:9%">Njësia</th><th class="n" style="width:12%">Sasia</th><th class="n" style="width:15%">Çmimi</th><th class="n">Vlera</th><th></th></tr></thead><tbody id="iLines"></tbody></table></div>
    <div style="margin-top:8px"><button class="sm" id="iAdd">+ Shto rresht</button></div>
    <div class="paybox">
      ${out?`<div><div class="mut" style="font-size:12px">Nëntotali / TVSH</div><div id="iVat" style="font-variant-numeric:tabular-nums"></div></div>`:""}
      <div><div class="mut" style="font-size:12px">Totali${out?" me TVSH":""}</div><div class="big" id="iTot"></div></div>
      <div class="f pay"><label><span class="tag cash">Paguar cash</span></label><input class="num" id="iCash" value="${fq(num(f.cash))}"></div>
      <div class="f pay"><label><span class="tag bank">Paguar me bankë</span></label><input class="num" id="iBank" value="${fq(num(f.bank))}"></div>
      <div class="pay"><div class="mut" style="font-size:12px">Mbetet borxh</div><div class="big" id="iDebt"></div></div>
    </div>
    <div class="bar pay" style="margin-top:8px"><button class="sm" id="pAllC">Gjithë cash</button><button class="sm" id="pAllB">Gjithë bankë</button><button class="sm" id="pNone">Gjithë borxh</button></div>
    <div class="f" style="margin-top:8px"><label>Shënim (shfaqet në dokument)</label><input id="iShen" value="${esc(f.shenim||"")}"></div>`,
  {wide:true,saveText:out?"Ruaj":"Ruaj",onSave:()=>{
    readLines();
    f.data=$("#iData").value;f.nr=$("#iNr").value.trim();f.shenim=$("#iShen").value.trim();
    if(out){
      f.lloji=$("#iLl").value;f.klientId=$("#iKl").value;f.tvsh=num($("#iTv").value);f.tvshPerfshihet=$("#iTvP").value==="1";
      const k=kl(f.klientId);if(!k)return "Zgjidhni klientin (ose regjistroni një të ri).";
      f.pala=k.kompania;
      f.nivelCmimi=$("#iLv").value;f.burimi=$("#iBur").value;f.agjentId=$("#iAg").value;f.agjenti=f.agjentId?(ag(f.agjentId)||{}).emri||"":"";f.pika=$("#iPika").value.trim();
    } else f.pala=$("#iPala").value.trim();
    f.cash=isPro()?0:r2(num($("#iCash").value));f.bank=isPro()?0:r2(num($("#iBank").value));
    f.artikujt=f.artikujt.filter(l=>(l.produktId||l.pershkrim)&&num(l.sasia)!==0).map(l=>({produktId:l.produktId||"",pershkrim:l.produktId?"":l.pershkrim,njesia:l.produktId?((prod(l.produktId)||{}).njesia||""):(l.njesia||""),sasia:num(l.sasia),cmimi:num(l.cmimi)}));
    if(!f.data)return "Zgjidhni datën.";
    if(!f.nr)return "Shkruani numrin e dokumentit.";
    if(S[col].some(x=>x.nr===f.nr&&x.id!==(ex&&ex.id)&&(x.lloji||"fature")===(f.lloji||"fature")))return "Ky numër dokumenti ekziston. Përdorni një numër tjetër.";
    if(!f.artikujt.length)return "Shtoni të paktën një artikull.";
    if(f.cash<0||f.bank<0)return "Pagesat nuk mund të jenë negative.";
    const t=invTotal(f);
    if(f.cash+f.bank-t>0.004)return "Pagesa (cash + bankë) është më e madhe se totali.";
    if(t-f.cash-f.bank>0.004&&!f.pala)return `Për borxh duhet emri i ${out?"klientit":"furnitorit"}.`;
    const id=ex&&ex.id; if(ex&&ex.krijuar)f.krijuar=ex.krijuar; delete f.id;
    return (async()=>{const nid=await save(col,id,f);
      if(nid&&opts.fromMbushje)await mbSet(opts.fromMbushje,{statusi:"aprovuar",nrFature:f.nr});
      if(nid&&opts.convertFrom){const o={...opts.convertFrom};delete o.id;o.konvertuar=f.nr;await save("daljet",opts.convertFrom.id,o)}})();
  }});
  const Q=s=>root.querySelector(s);
  function lineRow(l,i){
    const st=l.produktId!==""&&stockMap[l.produktId]!==undefined?stockMap[l.produktId]:null;
    const p=prod(l.produktId);
    return `<tr data-i="${i}"><td><select data-k="produktId"><option value="">— Tjetër / shërbim (pa stok) —</option>${prods.map(p=>`<option value="${p.id}" ${l.produktId===p.id?"selected":""}>${esc(p.emri)}${p.kodi?" ("+esc(p.kodi)+")":""}</option>`).join("")}</select>
      ${l.produktId?`<div class="mut" style="font-size:11px;margin-top:2px">Në stok: ${fq(st)} ${esc(p&&p.njesia||"")}</div>`:`<input data-k="pershkrim" placeholder="Përshkrimi i artikullit" value="${esc(l.pershkrim||"")}" style="margin-top:4px">`}</td>
      <td>${l.produktId?`<span class="mut">${esc(p&&p.njesia||"")}</span>`:`<input data-k="njesia" value="${esc(l.njesia??"copë")}">`}</td>
      <td><input class="num" data-k="sasia" value="${fq(num(l.sasia))}"></td><td><input class="num" data-k="cmimi" value="${fq(num(l.cmimi))}"></td>
      <td class="n" data-v></td><td><button class="sm dang" data-rm>✕</button></td></tr>`;
  }
  function drawLines(){Q("#iLines").innerHTML=f.artikujt.map(lineRow).join("");recalc()}
  function readLines(){root.querySelectorAll("#iLines tr").forEach(tr=>{const l=f.artikujt[+tr.dataset.i];tr.querySelectorAll("[data-k]").forEach(inp=>{l[inp.dataset.k]=inp.value})})}
  function recalc(){
    readLines();
    root.querySelectorAll("#iLines tr").forEach(tr=>{const l=f.artikujt[+tr.dataset.i];tr.querySelector("[data-v]").textContent=fmt(num(l.sasia)*num(l.cmimi))});
    const tmp={artikujt:f.artikujt,tvsh:out?num(Q("#iTv").value):0,tvshPerfshihet:out?Q("#iTvP").value==="1":true};
    const v=vat(tmp);
    if(out)Q("#iVat").innerHTML=`${fmt(v.sub)}<br><span class="mut">TVSH ${fq(v.rt)}%: ${fmt(v.tax)}</span>`;
    const d=v.tot-num(Q("#iCash").value)-num(Q("#iBank").value);
    Q("#iTot").textContent=fmt(v.tot);Q("#iDebt").textContent=fmt(d);Q("#iDebt").className="big "+(Math.abs(d)>0.004?"neg":"pos");

  function syncType(){

  function syncClient(user){if(!out)return;f.klientId=Q("#iKl").value;Q("#iCard").innerHTML=clientCard(kl(f.klientId));
    if(user&&kl(f.klientId)){const nl=clLevel(kl(f.klientId));if(Q("#iLv").value!==nl){Q("#iLv").value=nl;reprice();toast("Çmimet: "+lvName(nl))}}
    const k=kl(f.klientId),pi=Q("#iPika");if(k&&!pi.value){const prev=S.daljet.filter(d=>d.klientId===k.id&&d.pika).sort(byDate)[0];pi.placeholder=prev?prev.pika:k.kompania+(k.qyteti?" – "+k.qyteti:"")}

  ["#iCash","#iBank"].forEach(s=>Q(s).addEventListener("input",recalc));

  Q("#pAllB").onclick=()=>{const t=recalc();Q("#iBank").value=fq(t);Q("#iCash").value="0";recalc()};

function importProdModal(){
  const cols=["Emri","Kodi","Njësia","Çmimi blerjes",lvName("A"),lvName("B"),lvName("C"),"Stoku fillestar"];
  const root=modal("Importo produktet nga Excel",`
    <p style="margin-top:0">Në Excel vendosni kolonat në këtë renditje, selektoni rreshtat (pa titujt), kopjoni (Ctrl+C) dhe ngjitini këtu (Ctrl+V):</p>
    <div class="tablewrap" style="margin-bottom:10px"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr><tr><td>Kafe Covim</td><td>KC-1</td><td>copë</td><td class="n">12</td><td class="n">20</td><td class="n">15</td><td class="n">13</td><td class="n">50</td></tr></table></div>
    <textarea id="impT" rows="9" style="width:100%;font-family:monospace;font-size:12px" placeholder="Ngjitni këtu…"></textarea>
    <div id="impP" class="note"></div>
    <p class="note">Produktet me emër që ekziston përditësohen (çmimet dhe të dhënat); të rejat shtohen.</p>`,{wide:true,saveText:"Importo",onSave:()=>{
      const rows=parse();if(!rows.ok.length)return "Nuk u gjet asnjë rresht i vlefshëm.";if(rows.bad.length)return "Rreshtat "+rows.bad.join(", ")+" kanë gabime (emri ose ndonjë nga 3 çmimet mungon).";
      return (async()=>{let n=0;for(const o of rows.ok){const ex=S.produktet.find(x=>key(x.emri)===key(o.emri));const d=ex?{...ex,...o}:o;if(ex){delete d.id}await save("produktet",ex&&ex.id,d);n++}toast(n+" produkte u importuan")})();
    }});
  function parse(){
    const ok=[],bad=[];root.querySelector("#impT").value.split(/\r?\n/).forEach((ln,i)=>{if(!ln.trim())return;const c=ln.split(ln.includes("\t")?"\t":";").map(x=>x.trim());
      const o={emri:c[0]||"",kodi:c[1]||"",njesia:c[2]||"copë",cmimiBlerje:num(c[3]),cmimiShitje:num(c[4]),cmimiB:num(c[5]),cmimiC:num(c[6]),stokFillestar:num(c[7]),stokMin:""};
      if(!o.emri||key(o.emri)==="emri"){if(key(o.emri)!=="emri")bad.push(i+1);return}
      if(!(o.cmimiShitje>0&&o.cmimiB>0&&o.cmimiC>0)){bad.push(i+1);return}
      const ex=S.produktet.find(x=>key(x.emri)===key(o.emri));if(ex){o.stokMin=ex.stokMin??"";if(c[7]===undefined||c[7]==="")o.stokFillestar=num(ex.stokFillestar)}
      ok.push(o)});
    return {ok,bad};
  }
  root.querySelector("#impT").addEventListener("input",()=>{const r=parse();root.querySelector("#impP").innerHTML=`${r.ok.length} rreshta gati për import${r.bad.length?` · <span style="color:var(--red)">${r.bad.length} me gabime (rreshtat ${r.bad.join(", ")})</span>`:""}`});
}

  const text=rows.map(r=>r.map(q).join(";")).join("\n");

function aVeh(){const me=A.prof&&ag(A.prof.agjentId);const ps=typeof aPendSwap==="function"&&aPendSwap();if(ps&&me&&me.automjetId!==ps.automjetId)return veh(ps.automjetId);return me&&me.automjetId?veh(me.automjetId):null}
function aVanQty(pid){const v=aVeh();if(!v)return 0;let base=num(((A.stok.loc||{})["a:"+v.id]||{})[pid]);const me=A.prof&&ag(A.prof.agjentId),ps=aPendSwap();if(ps&&me&&me.automjetId!==ps.automjetId&&ps.merrStokun&&me.automjetId)base+=num(((A.stok.loc||{})["a:"+me.automjetId]||{})[pid]);
  const pend=A.mb.filter(m=>m.tip==="mbushje"&&m.statusi==="e re"&&m.automjetId===v.id).reduce((a,m)=>a+(m.artikujt||[]).filter(l=>l.produktId===pid).reduce((x,l)=>x+num(l.sasia),0),0);return r2(base-pend)}
function aPikQty(pikaId,pid){const base=num(((A.stok.loc||{})["p:"+pikaId]||{})[pid]);
  const pend=A.mb.filter(m=>m.tip==="mbushje"&&m.statusi==="e re"&&m.pikaId===pikaId).reduce((a,m)=>a+(m.artikujt||[]).filter(l=>l.produktId===pid).reduce((x,l)=>x+num(l.sasia),0),0);return r2(base+pend)}

function dBindMove(R){
  const $$=id=>document.getElementById(id);if(!$$("dMt"))return;
  $$("dMt").onchange=e=>{D.mvT=e.target.value;dRender()};$$("dMv").onchange=e=>{D.mvV=e.target.value;dRender()};
  R.querySelectorAll("[data-mp],[data-mm]").forEach(b=>b.onclick=()=>{const id=b.dataset.mp||b.dataset.mm;const x=num(D.mcart[id])+(b.dataset.mp?1:-1);if(x>0)D.mcart[id]=x;else delete D.mcart[id];dRender()});
  R.querySelectorAll("input[data-mq]").forEach(i=>i.onchange=()=>{const x=num(i.value);if(x>0)D.mcart[i.dataset.mq]=x;else delete D.mcart[i.dataset.mq];dRender()});
  $$("dMs").onclick=async()=>{
    const t=D.mvT||"ngarkim",v=D.mvV;if(!v){D.err="Zgjidhni automjetin.";return dRender()}

      D.sending=false;D.mcart={};D.view="mine";toast(t==="ngarkim"?"Automjeti u ngarkua":"Kthimi u ruajt");dRender();scrollTo(0,0)}
    catch(e){D.sending=false;D.err="Nuk u ruajt. Provoni përsëri.";dRender()}

const SPRIO={urgjent:["Urgjent","debt"],normal:["Normal","warn"],ulet:["I ulët","grey"]};

const srv = id=>S.serviseret.find(x=>x.id===id);
const addDays=(d,n)=>{const [y,m,dd]=String(d).split("-").map(Number);return new Date(Date.UTC(y,m-1,dd+n)).toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
function aprLoc(a){if(!a)return "";if(a.vendi==="klient"&&a.klientId)return "Klienti: "+((kl(a.klientId)||{}).kompania||"?");if(a.pikaId&&pik(a.pikaId))return "Pika: "+pik(a.pikaId).emri;if(a.vendi==="depo")return "Në depo";return ""}
function srvLoc(s){if(!s)return "?";if(s.pikaId&&pik(s.pikaId))return pik(s.pikaId).emri;if(s.klientId&&kl(s.klientId))return kl(s.klientId).kompania;const a=s.aparatId&&apr(s.aparatId);if(a){if(a.vendi==="klient"&&kl(a.klientId))return kl(a.klientId).kompania;if(pik(a.pikaId))return pik(a.pikaId).emri}return "?"}
function srvAddr(s){const k=s.klientId?kl(s.klientId):null,p=s.pikaId?pik(s.pikaId):null;const o=k||p||{};return [o.adresa,o.qyteti].filter(Boolean).join(", ")+(k&&k.tel?" · tel. "+k.tel:"")}
function lastPer(match,start){let d=start||"";S.servisimet.forEach(s=>{if(match(s)&&s.lloji==="Servis periodik"&&s.statusi==="kryer"&&(s.kryerNe||"").slice(0,10)>d)d=(s.kryerNe||"").slice(0,10)});return d}
function periodicDue(){
  const out=[];const add=(key,emri,iv,match,start,t)=>{const last=lastPer(match,start);const next=last?addDays(last,iv):today();
    out.push({p:{id:key,emri},iv,last,next,late:daysBetween(next,today()),open:S.servisimet.some(s=>match(s)&&s.lloji==="Servis periodik"&&s.statusi!=="kryer"),t})};
  S.pikat.forEach(p=>{const iv=num(p.servisDite);if(iv)add("p:"+p.id,p.emri,iv,s=>s.pikaId===p.id&&!s.aparatId,p.servisFundit,{pikaId:p.id})});
  S.aparatet.forEach(a=>{const iv=num(a.servisDite);if(iv)add("a:"+a.id,aprLabel(a)+(aprLoc(a)?" – "+aprLoc(a).replace(/^\w+: /,""):""),iv,s=>s.aparatId===a.id,a.servisFundit,{aparatId:a.id,pikaId:a.vendi==="klient"?"":a.pikaId||"",klientId:a.vendi==="klient"?a.klientId||"":""})});
  return out.sort((a,b)=>a.next.localeCompare(b.next));
}
function perTarget(key){const x=periodicDue().find(y=>y.p.id===key);return x?x.t:{}}
function openServ(){const pr={urgjent:0,normal:1,ulet:2};return S.servisimet.filter(s=>s.statusi!=="kryer").sort((a,b)=>(pr[a.prioriteti]??1)-(pr[b.prioriteti]??1)||(a.afati||"9").localeCompare(b.afati||"9"))}
function bannerItems(){
  const it=openServ().map(s=>{const late=s.afati&&s.afati.slice(0,10)<today();return {cls:s.prioriteti==="urgjent"||late?"bad":"warn",
    t:`${s.prioriteti==="urgjent"?"⚠ URGJENT – ":"🔧 "}${srvLoc(s)}${s.aparatId&&apr(s.aparatId)?" ("+apr(s.aparatId).modeli+")":""}: ${s.problemi||s.lloji}`,
    sub:`${s.lloji||""}${s.afati?" · afati "+fd(s.afati.slice(0,10))+(s.afati.length>10?" "+s.afati.slice(11,16):""):""}${late?" (i vonuar)":""} · ${SSTAT[s.statusi||"hapur"][0]}${s.serviserId&&srv(s.serviserId)?" · "+srv(s.serviserId).emri:" · pa serviser"}`}});
  periodicDue().filter(x=>x.late>=0&&!x.open).forEach(x=>it.push({cls:x.late>0?"bad":"warn",t:`🗓 Servis periodik: ${x.p.emri}`,sub:`${x.late>0?"i vonuar "+x.late+" ditë":"sot"} · çdo ${x.iv} ditë${x.last?" · i fundit "+fd(x.last):""}`}));
  return it;
}
function bannerHTML(clickable){
  const it=bannerItems();if(!it.length)return "";
  const show=it.slice(0,4);
  return `<div class="sbanner ${it.some(x=>x.cls==="bad")?"bad":""}" ${clickable?'data-tab="servisimi" style="cursor:pointer"':""}>
    <div class="sbh">Servisimi: ${it.length} ${it.length===1?"punë e hapur":"punë të hapura"}${clickable?" – shiko »":""}</div>
    ${show.map(x=>`<div class="sbi ${x.cls}"><b>${esc(x.t)}</b><span>${esc(x.sub)}</span></div>`).join("")}${it.length>4?`<div class="sbi"><span>+ ${it.length-4} të tjera</span></div>`:""}</div>`;
}

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.85))}catch(e){return file}
}

function pikaStats(p){
  const months={};const M=k=>months[k]=months[k]||{cash:0,shitje:0,mbushje:0,sasi:0};
  const loc="p:"+p.id;
  S.levizjet.forEach(m=>{if(m.tip!=="mbushje"||m.ne!==loc||!m.data)return;const x=M(monKey(m.data));x.cash+=num(m.cash);x.mbushje++;x.sasi+=(m.artikujt||[]).reduce((a,l)=>a+num(l.sasia),0)});
  if(p.klientId)sales().forEach(d=>{if(d.klientId===p.klientId&&d.data){M(monKey(d.data)).shitje+=invTotal(d)}});
  const kom=num(p.komisioni);
  const rows=Object.entries(months).map(([k,x])=>({muaji:k,cash:r2(x.cash),shitje:r2(x.shitje),qark:r2(x.cash+x.shitje),komisioni:r2((x.cash+x.shitje)*kom/100),mbushje:x.mbushje,sasi:r2(x.sasi)})).sort((a,b)=>b.muaji.localeCompare(a.muaji));

const POR_STEPS=[["konf","Konfirmuar","✓"],["derg","Dërguar","🚚"],["pran","Pranuar","📦"],["fat","Faturuar","🧾"],["pag","Paguar","💶"]];
function invOpenFIFO(f){const k=key(f.pala);let pay=S.pagesat.filter(x=>x.lloji==="arketim"&&key(x.pala)===k).reduce((a,x)=>a+num(x.shuma),0);
  const L=sales().filter(d=>key(d.pala)===k&&invDebt(d)>0.004).sort((a,b)=>(a.data||"").localeCompare(b.data||"")||String(a.nr).localeCompare(String(b.nr)));
  for(const d of L){const x=invDebt(d);const used=Math.min(pay,x);pay-=used;if(d.id===f.id)return r2(x-used)}return r2(invDebt(f))}
function porInv(p){return (S.daljet||[]).filter(f=>f.lloji!=="profature"&&(f.porosiId===p.id||(p.faturaId&&f.id===p.faturaId)))}
function porTrack(p){
  const inv=porInv(p),tot=r2(inv.reduce((a,f)=>a+invTotal(f),0)),debt=r2(inv.reduce((a,f)=>a+invOpenFIFO(f),0));
  const st=p.statusi;const anul=st==="anuluar";
  const konf=st!=="e_re"&&!anul,derg=!!p.derguarNe||["derguar","pranuar","e_kryer"].includes(st)||(inv.length>0&&p.krijuarNga!=="Zyra"&&!!inv.find(f=>f.regjistruarNga==="Depo")),pran=!!p.pranuarNe||["pranuar","e_kryer"].includes(st);

  const next=anul?null:!konf?"konf":!derg?"derg":!pran?"pran":!fat?"fat":!pag?"pag":null;
  const stage=anul?"anul":!konf?"e_re":!derg?"per_derg":!pran?"ne_rruge":!fat?"pa_fat":!pag?"pa_pag":"kryer";
  return {inv,tot,debt,done,next,stage,anul}}
const POR_STG={e_re:["Pa konfirmuar","debt"],per_derg:["Për t'u dërguar","warn"],ne_rruge:["Në rrugë","bank"],pa_fat:["Pranuar – pa faturë","warn"],pa_pag:["Pa paguar","debt"],kryer:["E përfunduar","ok"],anul:["Anuluar","grey"]};

    case "newMove":moveModal(a.dataset.t,a.dataset.v);break;
    case "delMove":confirmBox("Ta fshij këtë lëvizje stoku? Stoku i lokacioneve rillogaritet.",()=>del("levizjet",id));break;
    case "locStock":locStockModal(a.dataset.l);break;
    case "mbOk":{const m=S.mbushjet.find(x=>x.uid===a.dataset.uid&&x.id===id);if(!m)break;
      const pre={lloji:"fature",data:m.data||today(),klientId:m.klientId,pala:m.pala,agjentId:m.agjentId,agjenti:(ag(m.agjentId)||{}).emri||"",pika:m.pika||"",artikujt:JSON.parse(JSON.stringify(m.artikujt||[])),cash:num(m.cash),bank:num(m.bank),
        tvsh:S.settings.tvsh??18,tvshPerfshihet:S.settings.tvshPerfshihet!==false,shenim:m.shenim||"",nivelCmimi:clLevel(kl(m.klientId))};pre.nr=nextNr("fature",pre.data);
      invoiceModal("daljet",pre,{fromMbushje:m});break}
    case "mbNo":{const m=S.mbushjet.find(x=>x.uid===a.dataset.uid&&x.id===id);if(!m)break;
      modal("Refuzo mbushjen",`<div class="f"><label>Arsyeja (agjenti e sheh në telefon)</label><input id="mbWhy"></div>`,{small:true,saveText:"Refuzo",onSave:()=>mbSet(m,{statusi:"refuzuar",shenimPronari:$("#mbWhy").value.trim()})});break}
    case "roleSet":{const uid=a.dataset.uid,r=a.dataset.r;let o={roli:r,krijuar:Date.now()};
      if(r==="serviser"){const sel=document.querySelector(`[data-servsel="${uid}"]`);if(!sel||!sel.value){toast("Shtoni fillimisht serviserin te skeda Servisimi.");break}o.serviserId=sel.value}
      (r?db.doc("roles/"+uid).set(o):db.doc("roles/"+uid).delete()).then(()=>toast(r?"Roli u caktua – të rifreskojë faqen":"Roli u hoq")).catch(handleErr);break}
    case "agAccDel":confirmBox("Ta shkëpus këtë llogari nga agjenti? Agjenti do të duhet të zgjedhë emrin përsëri.",async()=>{try{await db.doc("mbushjet/"+a.dataset.uid).delete()}catch(e){handleErr(e)}});break;
    case "editAg":agentModal(S.agjentet.find(x=>x.id===id));break;
    case "delAg":{const used=S.daljet.some(d=>d.agjentId===id);confirmBox(used?"Ky agjent ka mbushje të regjistruara. Ato mbeten, por emri i agjentit ruhet vetëm si tekst. Vazhdoni?":"Ta fshij agjentin?",()=>del("agjentet",id));break}
    case "agFat":invoiceModal("daljet",null,{lloji:"fature",agjentId:id});break;
    case "editKl":clientModal(S.klientet.find(x=>x.id===id));break;
    case "delKl":{const k=S.klientet.find(x=>x.id===id);const used=S.daljet.some(d=>d.klientId===id||key(d.pala)===key(k&&k.kompania));
      confirmBox(used?"Ky klient ka fatura. Faturat mbeten, por detajet e klientit (adresa, NUI) nuk do të shfaqen më. Vazhdoni?":"Ta fshij klientin?",()=>del("klientet",id));break}
    case "csv":csv(a.dataset.c);break;
  }
});
document.addEventListener("input",e=>{
  if(document.body.classList.contains("agent"))return;
  const q=e.target.dataset&&e.target.dataset.q;
  if(q){S["q_"+q]=e.target.value;const pos=e.target.selectionStart;render();const el=document.querySelector(`[data-q="${q}"]`);if(el){el.focus();el.setSelectionRange(pos,pos)}}
});
document.addEventListener("change",e=>{
  if(document.body.classList.contains("agent"))return;
  if(e.target.id==="fNga"||e.target.id==="fDeri"){S.nga=$("#fNga").value;S.deri=$("#fDeri").value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fpor")){S.f_por=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-ffat")){S.f_fat=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fag")){S.f_ag=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fpc")){S.f_pc=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fpors")){S.f_porS=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-frvm")){S.f_rvm=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fsrv")){S.f_srv=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fapm")){S.f_apm=e.target.value;render()}
  if(e.target.hasAttribute&&e.target.hasAttribute("data-fapv")){S.f_apv=e.target.value;render()}
  const sas=e.target.dataset&&e.target.dataset.srvas;if(sas){const s=S.servisimet.find(x=>x.id===sas);if(s)srvUpdate(s,{serviserId:e.target.value})}
  const acc=e.target.dataset&&e.target.dataset.agacc;
  if(acc){const o={...S.mbAgents[acc]};delete o.uid;o.agjentId=e.target.value;db.doc("mbushjet/"+acc).set(o).catch(handleErr)}
  const ps=e.target.dataset&&e.target.dataset.pstat;
  if(ps){const p=S.porosite.find(x=>x.id===ps);if(p){const o={...p};delete o.id;if(o.statusi==="e_re"&&e.target.value!=="e_re"&&!o.konfirmuarNe){o.konfirmuarNe=nowLocal();o.konfirmuarNga="Pronari"}o.statusi=e.target.value;save("porosite",ps,o)}}
});
function setPeriod(k){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),pad=n=>String(n).padStart(2,"0"),iso=(Y,M,D)=>`${Y}-${pad(M+1)}-${pad(D)}`;
  if(k==="sot"){S.nga=S.deri=today()}
  else if(k==="muaj"){S.nga=iso(y,m,1);S.deri=today()}
  else if(k==="mp"){const pm=new Date(y,m-1,1);S.nga=iso(pm.getFullYear(),pm.getMonth(),1);S.deri=iso(pm.getFullYear(),pm.getMonth(),new Date(y,m,0).getDate())}
  else if(k==="vit"){S.nga=`${y}-01-01`;S.deri=today()}
  else{S.nga="";S.deri=""}
  $("#fNga").value=S.nga;$("#fDeri").value=S.deri;render();
}

// ---------- boot ----------
setPeriod("muaj");
(async()=>{
  const st=$("#status");
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){localMode=true;st.textContent="Pa ruajtje – të dhënat humbasin pas mbylljes";st.className="status warn";render();return}
  let u=null;try{u=await window.claude.use("user")}catch(e){}
  const admin=u?await u.canEdit():false;
  if(!admin||location.hash==="#agjent"||location.hash==="#depo"||location.hash==="#servis"){let uid=null;try{uid=u?await u.id():null}catch(e){}
    let role="";if(uid){try{const r=await db.doc("roles/"+uid).get();role=r.exists?(r.data().roli||""):""}catch(e){}}
    let rdoc={};if(uid){try{const r=await db.doc("roles/"+uid).get();rdoc=r.exists?r.data():{}}catch(e){}}
    if(location.hash==="#servis"||role==="serviser"){bootServis(uid,rdoc.serviserId);return}
    if(location.hash==="#depo"||role==="depoist"){bootDepo(uid);return}
    bootAgent(uid);return}
  db.collection("roles").onSnapshot(s=>{S.roles={};s.docs.forEach(d=>S.roles[d.id]=d.data().roli||"");render()},()=>{});
  try{if(u&&u.can){const c=await u.can("data.write");if(c===false){S.canWrite=false;st.textContent="Vetëm lexim"}}}catch(e){}
  ownerWatchMbushjet();
  let pending=new Set([...COLS,"settings"]);
  const timer=setTimeout(()=>{if(pending.size){st.textContent="Të dhënat nuk po arrihen ende…";st.className="status warn"}},10000);
  const done=(k,snap)=>{if(!snap.metadata.fromCache){pending.delete(k);if(!pending.size){clearTimeout(timer);if(S.canWrite){st.textContent="Të dhënat u ruajtën ✓";st.className="status"}}}};
  const onErr=e=>{clearTimeout(timer);st.textContent="Lidhja me të dhënat u ndërpre";st.className="status err"};
  COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));done(c,s);render()},onErr));
  db.doc("config/settings").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};done("settings",s);render()},onErr);
})();
render();
</script>
